name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          # 3.9 = 声明的最低支持版本（转发器只用 stdlib；注解延迟求值，不依赖 3.10 语法）
          # 3.12 = Operit proot Ubuntu24 的实际环境
          python-version: ${{ matrix.python }}

      - name: 安装检查依赖（仅 PyYAML，用于 workflow 语法检查）
        run: python -m pip install --quiet pyyaml

      - name: 仓库一致性自检
        run: python tools/check_consistency.py .

      - name: 单元测试（转发器 find_chrome 边界）
        run: python -m unittest discover -s tests -v
      - name: 负例回归（验证检查脚本真的会抓问题；顺带回归 3.9/3.12 的 AST 兼容性）
        if: always()  # 前面的自检失败时仍运行：用于区分「仓库漂移」与「检查器坏了」
        run: bash tools/neg_cases.sh
